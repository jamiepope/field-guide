<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if title == "Paris Field Guide" %}Paris Field Guide{% else %}{{ title }} | Paris Field Guide{% endif %}</title>
    <link rel="stylesheet" href="{{ asset_prefix | default('') }}assets/css/style.css">
  </head>

  <body>
    <header class="site-header">
      <a class="brand" href="{{ home_href | default('index.html') }}">Paris Field Guide</a>
    </header>

    <main class="site-main">
      {% block content %}{% endblock %}
    </main>

    <nav class="bottom-nav" aria-label="Bottom navigation">
      <a href="{{ home_href | default('index.html') }}"
         {% if nav == "home" %}aria-current="page"{% endif %}>
        <span>Home</span>
      </a>

      <a href="{{ days_href | default('index.html#days') }}"
         {% if nav == "days" %}aria-current="page"{% endif %}>
        <span>Days</span>
      </a>

      <a href="{{ tickets_href | default('index.html#tickets') }}"
         {% if nav == "tickets" %}aria-current="page"{% endif %}>
        <span>Tickets</span>
      </a>
    </nav>
  </body>
</html>
