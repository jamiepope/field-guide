[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paris-guide"
version = "0.1.0"
description = "Markdown-first static site generator for a Paris field guide."
requires-python = ">=3.11"
dependencies = [
    "Jinja2>=3.1,<4",
    "markdown-it-py>=3,<4",
]

[project.scripts]
paris-guide-build = "generator.site:main"

[tool.setuptools]
packages = ["generator"]
